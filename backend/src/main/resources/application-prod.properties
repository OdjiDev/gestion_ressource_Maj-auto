# ------------------------------------------------------------------------------
# APPLICATION & SERVEUR
# ------------------------------------------------------------------------------
spring.application.name=Spring_Back_end
server.port=9080

# Masquer la version de Spring Boot et les détails d'erreurs dans les réponses HTTP
server.error.include.stacktrace=never
server.error.include.message=never
server.error.include.binding-errors=never
server.error.include.exception=false

# ------------------------------------------------------------------------------
# BASE DE DONNÉES (Remplacer les variables par les accès réels ou variables d'environnement)
# ------------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/flutter_prod?useSSL=true&requireSSL=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP) - Optimisation Production
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# ------------------------------------------------------------------------------
# JPA / HIBERNATE (SÉCURISÉ)
# ------------------------------------------------------------------------------
# Ne JAMAIS utiliser 'update' ou 'create' en production pour éviter la perte ou la corruption de données
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.generate-ddl=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# ------------------------------------------------------------------------------
# LOGGING (Éviter d'exposer des données sensibles dans les logs)
# ------------------------------------------------------------------------------
logging.level.root=WARN
logging.level.com.odji.spring_back_end=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
