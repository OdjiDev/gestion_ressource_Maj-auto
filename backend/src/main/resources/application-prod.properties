# ==============================================================================
# APPLICATION & SERVEUR
# ==============================================================================
spring.application.name=Spring_Back_end
server.port=8081

# ==============================================================================
# BASE DE DONNEES (MySQL dans Docker)
# ==============================================================================
spring.datasource.url=jdbc:mysql://stock_db:3306/${MYSQL_DATABASE}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# ==============================================================================
# JPA / HIBERNATE (PRODUCTION)
# ==============================================================================
# ?? CRITIQUE : validate, jamais update
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.generate-ddl=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==============================================================================
# JWT
# ==============================================================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ==============================================================================
# CORS (inutile car Nginx proxy même origine)
# ==============================================================================
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://stock.numeriquesolution.com}

# ==============================================================================
# GESTION DES ERREURS (Production)
# ==============================================================================
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# ==============================================================================
# LOGGING
# ==============================================================================
logging.level.root=WARN
logging.level.com.odji.spring_back_end=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN

# ==============================================================================
# ACTUATOR (Healthcheck)
# ==============================================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
