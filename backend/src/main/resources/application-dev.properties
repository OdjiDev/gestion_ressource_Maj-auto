# ------------------------------------------------------------------------------
# APPLICATION & SERVEUR
# ------------------------------------------------------------------------------
spring.application.name=Spring_Back_end
server.port=8080
# PAS de context-path : les contrôleurs gèrent déjà /api/...

# ------------------------------------------------------------------------------
# BASE DE DONNEES (MySQL dans Docker)
# ------------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://stock_db:3306/${MYSQL_DATABASE}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------------------------------------
# JPA / HIBERNATE
# ------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ------------------------------------------------------------------------------
# GESTION DES ERREURS (Production)
# ------------------------------------------------------------------------------
server.error.include.stacktrace=never
server.error.include.message=never
server.error.include.binding-errors=never
server.error.include.exception=false

# ------------------------------------------------------------------------------
# LOGGING
# ------------------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.odji.spring_back_end=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN

# ------------------------------------------------------------------------------
# SPRING DEVTOOLS (Desactive en production)
# ------------------------------------------------------------------------------
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false