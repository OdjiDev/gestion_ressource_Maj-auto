# ------------------------------------------------------------------------------
# APPLICATION & SERVEUR
# ------------------------------------------------------------------------------
spring.application.name=Spring_Back_end
server.port=9081

# ------------------------------------------------------------------------------
# BASE DE DONNÉES (MySQL / MariaDB local)
# ------------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/Stock_Server?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------------------------------------
# JPA / HIBERNATE (Mode Confort Développement)
# ------------------------------------------------------------------------------
# 'update' met à jour ou crée automatiquement les tables selon vos entités Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=true
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# Affiche les requêtes SQL exécutées et les formate dans la console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true

# ------------------------------------------------------------------------------
# GESTION DES ERREURS & DÉBOGAGE (Syntaxe à jour)
# ------------------------------------------------------------------------------
# En DEV, on affiche les détails des erreurs pour faciliter le débogage
server.error.include.stacktrace=always
server.error.include.message=always
server.error.include.binding-errors=always
server.error.include.exception=true

# ------------------------------------------------------------------------------
# LOGGING (Niveau de détails pour le suivi)
# ------------------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.odji.spring_back_end=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ------------------------------------------------------------------------------
# SPRING DEVTOOLS (Rechargement automatique)
# ------------------------------------------------------------------------------
# Active le redémarrage automatique à la modification du code Java
spring.devtools.restart.enabled=true
#A retirer pour la depreciation
spring.devtools.livereload.enabled=true
