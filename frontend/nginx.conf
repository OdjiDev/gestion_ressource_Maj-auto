# ==================== RATE LIMITING (déclaré avant les server blocks) ====================
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

# ==================== FRONTEND + PROXY API ====================
server {
    #  CORRIGÉ : 8080 (non-root) au lieu de 443 (réservé root)
    # Le SSL est géré par le PROXY EXTERNE, pas par le frontend.
    listen 8080;
    server_name _;

    # ==================== RÉSOLUTION DOCKER (obligatoire pour proxy par nom) ====================
    resolver 127.0.0.11 valid=10s;

    # ==================== FRONTEND ANGULAR ====================
    root /usr/share/nginx/html;
    index index.html;

    # ==================== COMPRESSION ====================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # ==================== SÉCURITÉ ====================
    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ==================== ROUTAGE SPA ANGULAR ====================
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ==================== ASSETS STATIQUES ====================
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ==================== PROXY BACKEND ====================
    location /api/ {
        #  CORRIGÉ : stock_backend (nom du conteneur) au lieu de backend
        # Variable pour permettre la résolution dynamique
        set $upstream_backend stock_backend;

        proxy_pass http://$upstream_backend:8081/api/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        client_max_body_size 20M;

        limit_req zone=api burst=20 nodelay;
    }
}
