<div class="compte-detail">
  <app-page-header title="Détail du compte" subtitle="Consultation" actionLabel="Modifier" actionIcon="✏️" (action)="onEdit()" />
  @if (error()) { <div class="alert-error">{{ error() }}</div> }
  @if (loading()) { <app-loading-spinner [visible]="true" message="Chargement..." /> }
  @if (compte(); as c) {
    <div class="detail-card">
      <div class="detail-row"><span class="detail-label">Code</span><span class="detail-value">{{ c.code }}</span></div>
      <div class="detail-row"><span class="detail-label">Nom</span><span class="detail-value">{{ c.nom }}</span></div>
      <div class="detail-row"><span class="detail-label">Type</span><span class="detail-value">{{ c.type }}</span></div>
      <div class="detail-row"><span class="detail-label">Devise</span><span class="detail-value">{{ c.devise }}</span></div>
      <div class="detail-row"><span class="detail-label">Solde initial</span><span class="detail-value">{{ c.soldeInitial }} FCFA</span></div>
      <div class="detail-row"><span class="detail-label">Solde actuel</span><span class="detail-value">{{ c.soldeActuel || c.soldeInitial }} FCFA</span></div>
      <div class="detail-row"><span class="detail-label">Actif</span><span class="detail-value">{{ c.actif ? 'Oui' : 'Non' }}</span></div>
    </div>
    <div class="detail-actions">
      <button class="btn btn-secondary" (click)="onBack()">← Retour</button>
      <button class="btn btn-primary" (click)="onEdit()">✏️ Modifier</button>
    </div>
  }
</div>
