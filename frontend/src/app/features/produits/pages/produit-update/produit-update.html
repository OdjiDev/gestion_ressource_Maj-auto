<div class="produit-update">
  <app-page-header title="Modifier le produit" subtitle="Mettre à jour les informations" />
  @if (error()) { <div class="alert-error">{{ error() }}</div> }
  @if (store.loading() && !initialData()) { <div class="loading">Chargement...</div> }
  @if (initialData(); as data) {
    @if (formConfig(); as config) {
      <app-crud-form [config]="config" [initialData]="data" [submitting]="store.loading()" (save)="onSave($event)" (cancel)="onCancel()" />
    }
  }
</div>
