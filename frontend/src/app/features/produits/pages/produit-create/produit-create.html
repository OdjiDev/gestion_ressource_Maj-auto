<div class="produit-create">
  <app-page-header title="Nouveau produit" subtitle="Créer un nouveau produit" />
  @if (error()) {
    <div class="alert-error">{{ error() }}</div>
  }
  @if (loading() && !formConfig()) {
    <div class="loading">Chargement...</div>
  }
  @if (formConfig(); as config) {
    <app-crud-form
      [config]="config"
      [submitting]="loading()"
      (save)="onSave($event)"
      (cancel)="onCancel()"
    />
  }
</div>
