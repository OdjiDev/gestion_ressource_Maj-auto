<div class="produit-list">
  <app-page-header title="Liste des Produits" subtitle="Gestion du catalogue produits" actionLabel="Ajouter" actionIcon="+" (action)="onCreate()" />
  @if (store.error()) { <div class="alert-error">{{ store.error() }}</div> }
  <app-data-table [columns]="columns" [data]="store.produits()" [loading]="store.loading()" emptyTitle="Aucun produit" emptyMessage="Commencez par ajouter votre premier produit." emptyActionLabel="Ajouter un produit" (edit)="onEdit($event)" (delete)="onDelete($event)" (emptyAction)="onCreate()" />
  <app-confirm-dialog [visible]="showConfirm()" title="Supprimer le produit" [message]="'Voulez-vous vraiment supprimer « ' + (produitToDelete()?.nom || '') + ' » ?'" confirmText="Supprimer" cancelText="Annuler" color="danger" (confirmed)="confirmDelete()" (cancelled)="closeConfirm()" />
</div>
