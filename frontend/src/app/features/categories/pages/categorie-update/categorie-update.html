<div class="categorie-update">
  <app-page-header title="Modifier la catégorie" subtitle="Mettre à jour les informations" />
  @if (error()) { <div class="alert-error">{{ error() }}</div> }
  @if (loading() && !initialData()) { <div class="loading">Chargement...</div> }
  @if (initialData(); as data) {
    <app-crud-form [config]="formConfig" [initialData]="data" [submitting]="loading()" (save)="onSave($event)" (cancel)="onCancel()" />
  }
</div>
