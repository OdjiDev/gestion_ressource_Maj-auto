<header class="app-header">
  <div class="d-flex justify-content-between align-items-center px-3 py-2 bg-dark text-white">
    <!-- Logo -->
    <div class="logo">
      <h4 class="mb-0">
        <i class="fa fa-boxes"></i> Gestion Ressources
      </h4>
    </div>

    <!-- User menu -->
    <div class="user-menu d-flex align-items-center gap-3">
      <div class="text-end">
        <div class="fw-bold">{{ email() }}</div>
        <small class="text-muted">{{ role() }}</small>
      </div>
      <button class="btn btn-sm btn-outline-light" (click)="logout()">
        <i class="fa fa-sign-out-alt"></i> Déconnexion
      </button>
    </div>
  </div>
</header>
