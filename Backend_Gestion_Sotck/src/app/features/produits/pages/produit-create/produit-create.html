<div class="container mt-4">
  <div class="card col-md-8 offset-md-2">
    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
      <h4 class="mb-0">Nouveau produit</h4>
      <button class="btn btn-sm btn-light" (click)="onCancel()">
        <i class="fa fa-arrow-left"></i> Retour
      </button>
    </div>

    <div class="card-body">
      @if (error()) {
        <div class="alert alert-danger">{{ error() }}</div>
      }

      <form (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label class="form-label">Code produit *</label>
          <input
            type="text"
            class="form-control"
            [(ngModel)]="produit.codeproduit"
            name="codeproduit"
            placeholder="Ex: VIS-M6"
            required />
        </div>

        <div class="mb-3">
          <label class="form-label">Nom *</label>
          <input
            type="text"
            class="form-control"
            [(ngModel)]="produit.nom"
            name="nom"
            placeholder="Ex: Vis M6"
            required />
        </div>

        <div class="mb-3">
          <label class="form-label">Désignation</label>
          <textarea
            class="form-control"
            [(ngModel)]="produit.designation"
            name="designation"
            rows="3"
            placeholder="Description du produit..."></textarea>
        </div>

        <div class="mb-3">
          <label class="form-label">Quantité</label>
          <input
            type="number"
            class="form-control"
            [(ngModel)]="produit.quantite"
            name="quantite"
            min="0"
            step="0.001" />
        </div>

        <div class="d-flex justify-content-end gap-2">
          <button type="button" class="btn btn-secondary"
                  (click)="onCancel()"
                  [disabled]="loading()">
            Annuler
          </button>
          <button type="submit" class="btn btn-success"
                  [disabled]="loading()">
            @if (loading()) {
              <span class="spinner-border spinner-border-sm me-2"></span>
            }
            {{ loading() ? 'Enregistrement...' : 'Sauvegarder' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
